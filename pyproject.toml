[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmachi"
version = "0.4.0"
description = "A Hamachi server for agents: start a hub, get an address, agents join and work together"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Emil Szymecki", email = "emilszymecki@gmail.com" }]
keywords = ["agents", "llm", "multi-agent", "websocket", "claude", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "websockets>=12",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]

[project.urls]
Homepage = "https://github.com/emilszymecki/agentmachi"
Issues = "https://github.com/emilszymecki/agentmachi/issues"

[project.scripts]
agentmachi = "agentmachi.cli:main"

[tool.setuptools]
packages = ["chat", "agentmachi"]
py-modules = ["send", "tui"]

# howto_default.md NIE jest opcjonalne: ensure_hub czyta je bezwarunkowo przy
# tworzeniu KAZDEGO pokoju (agentmachi/cli.py, "Szablon idzie z pakietu").
# Bez tego wpisu kolo zawiera same .py, a `agentmachi serve --name <nowy>`
# wywala sie FileNotFoundError przy pierwszym uzyciu. Niewidoczne przy
# `pip install -e .` (editable czyta z drzewa zrodel), wiec dziura przezyla
# do pierwszej instalacji pakietowej.
[tool.setuptools.package-data]
agentmachi = ["howto_default.md", "skills/**/*"]

# `skills/**/*` jest zachlanne i lapie takze __pycache__ ze skryptow skilli
# (powstaje przy uruchomieniu testow). Bez tego wykluczenia KAZDY
# `pip install agentmachi` niesie .pyc zbudowane na maszynie wydawcy.
# MANIFEST.in zalatwia to samo dla sdist — sa to dwie rozne sciezki
# pakowania i trzeba obu.
[tool.setuptools.exclude-package-data]
agentmachi = ["skills/**/__pycache__/*", "skills/**/*.py[cod]"]
